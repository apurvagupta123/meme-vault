<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeVault — Fresh takes, daily</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>Meme<span>Vault</span></h1>
    <div class="tagline">memes on whatever's happening right now</div>
  </div>
  <div class="controls">
    <input type="text" id="search" placeholder="search memes…">
  </div>
</header>

<div class="tag-bar" id="tagBar"></div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <h2>No memes yet</h2>
    <p>Add your first one with scripts/add_meme.py — check README.md.</p>
  </div>
</main>

<footer>Built for Dev · updated whenever a new meme drops</footer>

<div class="lightbox" id="lightbox">
  <button class="close-btn" id="closeBtn">&times;</button>
  <div class="lightbox-inner" id="lightboxInner"></div>
</div>

<script src="app.js"></script>
</body>
</html>
